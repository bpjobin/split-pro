name: Publish Docker

on:
  push:
    tags:
      - '*'

# NOTE: GitHub Actions cannot filter `on.push` by the pushing user, so a run is
# still *created* when anyone pushes a tag. The `if:` guard on the job below
# enforces "bpjobin only": runs triggered by anyone else are skipped (no build,
# no publish).

jobs:
  build_and_publish:
    name: Build and publish Docker image
    if: github.actor == 'bpjobin'
    runs-on: self-hosted
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the docker image
        run: |
          APP_VERSION="$(git name-rev --tags --name-only $(git rev-parse HEAD) | head -n 1 | sed 's/\^0//')"
          GIT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d-%H%M%S)"

          docker build \
            --progress=plain \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_SHA="$GIT_SHA" \
            -t "bpjobin/split-pro:latest" \
            -t "bpjobin/split-pro:$GIT_SHA" \
            -t "bpjobin/split-pro:build-$BUILD_DATE" \
            .

      - name: Push the docker image to DockerHub
        run: docker push --all-tags "bpjobin/split-pro"
